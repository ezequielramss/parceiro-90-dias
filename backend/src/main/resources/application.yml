spring:
  application:
    name: parceiro-backend
  config:
    # Em desenvolvimento, lê o .env da pasta backend/ se existir.
    # Variáveis de ambiente reais têm precedência sobre ele.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

# Sem valor padrão de propósito: a aplicação não sobe se faltar alguma.
parceiro:
  banco:
    url: ${DATABASE_URL}
    usuario: ${DATABASE_USER}
    senha: ${DATABASE_PASSWORD}
  # Check-in dos dias 1 a 10, a cada minuto (H04). Desligue com false (ex.: em testes).
  checkin:
    ativo: true

whatsapp:
  token: ${WHATSAPP_TOKEN}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  verify-token: ${WHATSAPP_VERIFY_TOKEN}
  app-secret: ${WHATSAPP_APP_SECRET}
  graph-version: ${WHATSAPP_GRAPH_VERSION}
  base-url: https://graph.facebook.com
  connect-timeout: 3s
  read-timeout: 10s

# Classificação de relatos (H18, H37). Chave e modelo só do ambiente; o resto tem padrão.
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}
  base-url: https://generativelanguage.googleapis.com
  connect-timeout: 3s
  read-timeout: 15s
  max-caracteres: 2000
  novas-tentativas: 2
  espera-inicial: 1s
  espera-maxima: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
