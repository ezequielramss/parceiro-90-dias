spring:
  application:
    name: parceiro-backend
  config:
    # Em desenvolvimento, lê o .env da pasta backend/ se existir.
    # Variáveis de ambiente reais têm precedência sobre ele.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

# Sem valor padrão de propósito: a aplicação não sobe se faltar alguma.
parceiro:
  banco:
    url: ${DATABASE_URL}
    usuario: ${DATABASE_USER}
    senha: ${DATABASE_PASSWORD}
  # Check-in dos dias 1 a 10, a cada minuto (H04). Desligue com false (ex.: em testes).
  checkin:
    ativo: true
  # Retenção (termo de participação): todo dia apaga texto e motivo dos relatos com mais de 90 dias.
  retencao:
    ativo: true
  # Dashboard (login pelo Supabase Auth). Opcional: sem URL ou chave, o painel responde 503 e o
  # WhatsApp continua funcionando. A chave nunca vai para o navegador.
  dashboard:
    supabase-url: ${SUPABASE_URL:}
    supabase-publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
    # Cookie só por HTTPS. Desligado apenas no perfil local (fim deste arquivo).
    cookie-seguro: true
    connect-timeout: 3s
    read-timeout: 10s
    # O Supabase guarda o JWKS por até 10 minutos; aqui, no máximo mais 10.
    jwks-cache: 10m
  # Canal do WhatsApp: evolution (padrão; Evolution API) ou simulador (chat local em /simulador).
  whatsapp:
    canal: ${WHATSAPP_CANAL:evolution}
  # Opções do menu do colaborador. Um agente desligado some do menu.
  agentes:
    relato:
      ativo: true
    elogio:
      ativo: true

# Evolution API. As quatro variáveis só são obrigatórias com o canal evolution: sem elas, a
# aplicação não sobe e diz quais faltam. Neste canal não há janela de 24 horas nem modelos.
evolution:
  api-url: ${EVOLUTION_API_URL:}
  api-key: ${EVOLUTION_API_KEY:}
  instance: ${EVOLUTION_INSTANCE:}
  webhook-secret: ${EVOLUTION_WEBHOOK_SECRET:}
  connect-timeout: 3s
  read-timeout: 10s

# Classificação de relatos (H18, H37). Chave e modelo só do ambiente; o resto tem padrão.
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL}
  base-url: https://generativelanguage.googleapis.com
  connect-timeout: 3s
  read-timeout: 15s
  max-caracteres: 2000
  novas-tentativas: 2
  espera-inicial: 1s
  espera-maxima: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

---
# Perfil local (SPRING_PROFILES_ACTIVE=local): dashboard em http://localhost, sem HTTPS.
spring:
  config:
    activate:
      on-profile: local
parceiro:
  dashboard:
    cookie-seguro: false
