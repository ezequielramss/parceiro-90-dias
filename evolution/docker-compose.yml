# Evolution API só para uso LOCAL (demonstração no celular do PO). Não use em produção:
# a conexão por QR code é não oficial e o número pode ser banido. A produção deve voltar à API
# oficial da Meta (tag git meta-cloud-api).
#
# Portas ligadas só a 127.0.0.1. Segredos vêm de evolution/.env (no .gitignore); veja .env.example.
# Versão fixa: v2.3.7, a última estável. A 2.4.0 passou a exigir ativação de licença.
#
# Subir: docker compose up -d   (dentro de evolution/)

name: parceiro-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: parceiro_evolution_api
    restart: unless-stopped
    ports:
      # 8081 na máquina: o backend do Parceiro já usa a 8080.
      - "127.0.0.1:8081:8080"
    extra_hosts:
      # Para a Evolution chamar o backend que roda fora do Docker (webhook).
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defina AUTHENTICATION_API_KEY em evolution/.env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN
      LANGUAGE: pt-BR

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em evolution/.env}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: parceiro_evolution
      # O termo de participação promete guarda de até 90 dias, e o Parceiro já guarda o que precisa.
      # A Evolution só guarda a instância (para manter o número conectado); mensagens, contatos,
      # conversas, etiquetas e histórico ficam desligados.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: parceiro_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # O webhook é configurado por instância (evolution/README.md), porque só o webhook da
      # instância envia o cabeçalho com o segredo compartilhado. O global fica desligado.
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ""
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16.4-alpine
    container_name: parceiro_evolution_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em evolution/.env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.1-alpine
    container_name: parceiro_evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  evolution_instances:
  evolution_postgres:
